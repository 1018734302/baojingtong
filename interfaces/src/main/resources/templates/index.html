<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保经通 · 保险经纪核心业务系统</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">保</span>
    <div>
      <h1>保经通 <small>BaoJingTong</small></h1>
      <p>保险经纪核心业务系统 · 保单生命周期 / 核保 / 理赔 / 佣金结算</p>
    </div>
  </div>
  <div class="top-right">
    <span class="badge ok" id="balanceBadge">借贷平衡校验中…</span>
    <button class="ghost" id="resetBtn">清空重置</button>
  </div>
</header>

<section class="kpis" id="kpis"></section>

<main class="layout">
  <aside class="panel ops">
    <h2>操作台</h2>

    <div class="op-card">
      <h3>① 新建客户</h3>
      <form id="customerForm">
        <div class="grid2">
          <label>姓名<input name="name" required placeholder="张伟"></label>
          <label>年龄<input name="age" type="number" value="35" min="1" max="100"></label>
          <label>性别
            <select name="gender"><option value="男">男</option><option value="女">女</option></select>
          </label>
          <label>职业<input name="occupation" placeholder="工程师"></label>
        </div>
        <button type="submit">保存客户</button>
      </form>
    </div>

    <div class="op-card">
      <h3>② 新建保险产品</h3>
      <form id="productForm">
        <div class="grid2">
          <label>产品名称<input name="productName" required placeholder="安心终身寿险"></label>
          <label>险种
            <select name="productType">
              <option value="寿险">寿险</option><option value="健康险">健康险</option>
              <option value="意外险">意外险</option><option value="财产险">财产险</option>
            </select>
          </label>
          <label>承保公司<input name="insurer" required placeholder="华泰人寿"></label>
          <label>保额(元)<input name="coverageYuan" type="number" value="1000000" required></label>
          <label>基准保费(元)<input name="premiumYuan" type="number" value="5000" required></label>
          <label>佣金率(0-1)<input name="commissionRate" type="number" step="0.01" value="0.25" required></label>
          <label>风险等级
            <select name="riskLevel"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
          </label>
          <label>最高承保年龄<input name="maxAge" type="number" value="65"></label>
        </div>
        <button type="submit">保存产品</button>
      </form>
    </div>

    <div class="op-card">
      <h3>③ 投保出单（核保 → 承保 → 计提佣金）</h3>
      <form id="policyForm">
        <div class="grid2">
          <label>客户<select name="customerId" id="customerSelect" required></select></label>
          <label>产品<select name="productId" id="productSelect" required></select></label>
          <label>保额(元)<input name="coverageYuan" type="number" value="1000000" required></label>
          <label>被保人年龄<input name="insuredAge" type="number" value="35" required></label>
          <label class="span2">被保人姓名<input name="insuredName" placeholder="留空默认客户姓名"></label>
        </div>
        <button type="submit" class="primary">提交投保</button>
      </form>
    </div>

    <div class="op-card">
      <h3>④ 理赔报案</h3>
      <form id="claimForm">
        <div class="grid2">
          <label>保单号<input name="policyNo" id="claimPolicyNo" required placeholder="POL..."></label>
          <label>出险类型
            <select name="accidentType">
              <option value="意外医疗">意外医疗</option><option value="疾病住院">疾病住院</option>
              <option value="身故">身故</option><option value="伤残">伤残</option><option value="其他">其他</option>
            </select>
          </label>
          <label class="span2">申请金额(元)<input name="claimYuan" type="number" value="10000" required></label>
        </div>
        <button type="submit">提交报案</button>
      </form>
    </div>

    <div class="op-card">
      <h3>⑤ 理赔审核与赔付</h3>
      <form id="reviewForm">
        <div class="grid2">
          <label>理赔单号<input name="claimNo" id="reviewClaimNo" required placeholder="CLM..."></label>
          <label>结论
            <select name="approve"><option value="true">审核通过</option><option value="false">拒赔</option></select>
          </label>
          <label>核定金额(元)<input name="approvedYuan" type="number" value="8000"></label>
          <label>备注<input name="remark" placeholder="审核说明"></label>
        </div>
        <button type="submit">提交审核</button>
      </form>
      <div class="inline-actions">
        <input id="payClaimNo" placeholder="理赔单号" style="flex:1">
        <button id="payBtn" class="warn">赔付</button>
      </div>
    </div>

    <div class="op-card">
      <h3>⑥ 佣金结算</h3>
      <p class="hint">将所有「待结算」佣金记账支付：借 应付佣金 / 贷 银行存款</p>
      <button id="settleBtn" class="primary">结算全部佣金</button>
    </div>
  </aside>

  <section class="panel data">
    <nav class="tabs" id="dataTabs">
      <button data-tab="policy" class="active">保单</button>
      <button data-tab="claim">理赔</button>
      <button data-tab="commission">佣金</button>
      <button data-tab="account">账户</button>
      <button data-tab="event">事件流</button>
    </nav>
    <div id="dataBody" class="data-body"></div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
